# --------------------------------------------------
#  BASIC SITE INFO
# --------------------------------------------------
title: Xuanyu Zhou  # Main site title (appears in browser tab & RSS)
tagline: Urban analytics, equity, mobility, and AI for planning.
description: Xuanyu Zhou is an urban analytics researcher working across equity, mobility, resilience, remote sensing, and machine learning.

# TIP ── For local development you can comment out `url`
# and build with relative paths. In production you want this set.
url: https://xuanyuzhou.org

# --------------------------------------------------
#  AUTHOR / PROFILE DATA
# --------------------------------------------------
owner:
  name: Xuanyu Zhou
  affiliation: University of Pennsylvania
  avatar: fav.png
  cv: https://xuanyuzhou.org/file/Xuanyu_Zhou_CV.pdf
  github: DOGZzl1xy
  scholar: https://scholar.google.com/citations?user=nK7_DHMAAAAJ
  ORCID: https://orcid.org/0009-0004-8534-0211


# --------------------------------------------------
#  TOP NAVIGATION BAR
#  `external: true` opens the link in a new tab.
# --------------------------------------------------
links:
  - title: About Me
    url: /
  - title: Projects
    url: /projects/
  - title: Publications
    url: /publication/
  - title: Awards
    url: /awards/
  - title: Coursework
    url: /courseworks/


# --------------------------------------------------
#  BUILD & RENDERING OPTIONS
# --------------------------------------------------
timezone: Asia/Shanghai          # IANA time-zone ID (China/Beijing is invalid)
future: false


# --------------------------------------------------
#  PERMALINK STRUCTURE
# --------------------------------------------------
permalink: /:categories/:title    # e.g. /tech/my-post/


# --------------------------------------------------
#  KRAMDOWN (Markdown engine) SETTINGS
# --------------------------------------------------
kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

# --------------------------------------------------
#  INCLUDE / EXCLUDE Lists
# --------------------------------------------------
exclude:                         # Folders/files ignored during build
  - "tmp"
  - "vendor"
  - "portfolio/SVF/DATA_2022_2024_final.csv"
  - "README.md"
  - "LICENSE"
  - "scripts"
  - "tests"


# --------------------------------------------------
#  OPTIONAL PLUG-INS (uncomment once gems are added)
# --------------------------------------------------
plugins:
  - jekyll-sitemap       # Auto-generate sitemap.xml


# --------------------------------------------------
#  FRONT MATTER DEFAULTS
#  (keeps the unlinked archive page out of sitemap.xml)
# --------------------------------------------------
defaults:
  - scope:
      path: "along-the-way.html"
    values:
      sitemap: false
